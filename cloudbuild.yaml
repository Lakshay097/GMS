# Cloud Build configuration for deploying to Cloud Run
steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/school-operations/api:latest', '.']
  
  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/school-operations/api:latest']
  
  # Deploy to Cloud Run with Secret Manager integration
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'school-operations-api'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/school-operations/api:latest'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--timeout=300s'
      - '--set-env-vars=DATABASE_URL=${_DATABASE_URL}'
      - '--set-env-vars=DATABASE_READ_REPLICA_URL=${_DATABASE_READ_REPLICA_URL}'
      - '--set-env-vars=NEON_PROJECT_ID=${_NEON_PROJECT_ID}'
      - '--set-env-vars=NEON_BRANCH_ID=${_NEON_BRANCH_ID}'
      - '--set-env-vars=NEON_API_KEY=${_NEON_API_KEY}'
      - '--set-env-vars=NEON_AUTH_BASE_URL=${_NEON_AUTH_BASE_URL}'
      - '--set-env-vars=NEON_AUTH_COOKIE_SECRET=${_NEON_AUTH_COOKIE_SECRET}'
      - '--set-env-vars=DEFAULT_SCHOOL_TIMEZONE=${_DEFAULT_SCHOOL_TIMEZONE}'
      - '--set-env-vars=CLOUDINARY_CLOUD_NAME=${_CLOUDINARY_CLOUD_NAME}'
      - '--set-env-vars=CLOUDINARY_API_KEY=${_CLOUDINARY_API_KEY}'
      - '--set-env-vars=CLOUDINARY_API_SECRET=${_CLOUDINARY_API_SECRET}'
      - '--set-env-vars=CLOUDINARY_UPLOAD_PRESET=${_CLOUDINARY_UPLOAD_PRESET}'
      - '--set-env-vars=QUEUE_PROVIDER=redis'
      - '--set-env-vars=QUEUE_CONNECTION_STRING=${_REDIS_URL}'
      - '--set-env-vars=REDIS_URL=${_REDIS_URL}'
      - '--set-env-vars=SEARCH_INDEX_URL=${_SEARCH_INDEX_URL}'
      - '--set-env-vars=SEARCH_INDEX_API_KEY=${_SEARCH_INDEX_API_KEY}'
      - '--set-env-vars=EMAIL_PROVIDER_API_KEY=${_EMAIL_PROVIDER_API_KEY}'
      - '--set-env-vars=EMAIL_FROM=${_EMAIL_FROM}'
      - '--set-env-vars=SMS_PROVIDER_API_KEY=${_SMS_PROVIDER_API_KEY}'
      - '--set-env-vars=WHATSAPP_PROVIDER_API_KEY=${_WHATSAPP_PROVIDER_API_KEY}'
      - '--set-secrets=INTERNAL_SCHEDULER_SECRET=school-operations-internal-scheduler-secret:latest'
      - '--set-env-vars=CORS_ORIGINS=${_CORS_ORIGINS}'
      - '--set-env-vars=LOG_LEVEL=${_LOG_LEVEL}'

substitutions:
  _DATABASE_URL: ''
  _DATABASE_READ_REPLICA_URL: ''
  _NEON_PROJECT_ID: ''
  _NEON_BRANCH_ID: ''
  _NEON_API_KEY: ''
  _NEON_AUTH_BASE_URL: ''
  _NEON_AUTH_COOKIE_SECRET: ''
  _DEFAULT_SCHOOL_TIMEZONE: 'Asia/Kolkata'
  _CLOUDINARY_CLOUD_NAME: ''
  _CLOUDINARY_API_KEY: ''
  _CLOUDINARY_API_SECRET: ''
  _CLOUDINARY_UPLOAD_PRESET: ''
  _REDIS_URL: ''
  _SEARCH_INDEX_URL: ''
  _SEARCH_INDEX_API_KEY: ''
  _EMAIL_PROVIDER_API_KEY: ''
  _EMAIL_FROM: 'onboarding@resend.dev'
  _SMS_PROVIDER_API_KEY: ''
  _WHATSAPP_PROVIDER_API_KEY: ''
  _CORS_ORIGINS: '*'
  _LOG_LEVEL: 'info'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'