# Cloud Build configuration for deploying to Cloud Run
# Uses Google Secret Manager for all sensitive values.
#
# ─── REQUIRED GCP IAM PERMISSIONS ─────────────────────────────────────────────
#
# 1. Cloud Build service account (default: PROJECT_NUMBER@cloudbuild.gserviceaccount.com)
#    Grant these roles on the GCP project:
#      - roles/cloudbuild.builds.builder          (already granted by default)
#      - roles/secretmanager.secretAccessor       (read secrets during build)
#      - roles/run.admin                          (deploy to Cloud Run)
#      - roles/iam.serviceAccountUser             (act as Cloud Run runtime SA)
#      - roles/artifactregistry.writer            (push Docker images)
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#      --role="roles/secretmanager.secretAccessor"
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#      --role="roles/run.admin"
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#      --role="roles/iam.serviceAccountUser"
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#      --role="roles/artifactregistry.writer"
#
# 2. Cloud Run runtime service account (default: PROJECT_NUMBER-compute@developer.gserviceaccount.com)
#    Grant this role on the project so the running container can read secrets:
#      - roles/secretmanager.secretAccessor
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
#      --role="roles/secretmanager.secretAccessor"
#
# 3. APIs to enable:
#      - cloudbuild.googleapis.com
#      - run.googleapis.com
#      - secretmanager.googleapis.com
#      - artifactregistry.googleapis.com
#
#    gcloud services enable cloudbuild.googleapis.com run.googleapis.com \
#      secretmanager.googleapis.com artifactregistry.googleapis.com
#
# ──────────────────────────────────────────────────────────────────────────────

steps:
  # ── Step 1: Build Docker image ──────────────────────────────────────────────
  # Vite build args are passed from Secret Manager via secretEnv.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/school-operations/api:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/school-operations/api:latest'
      - '--build-arg=VITE_CLERK_PUBLISHABLE_KEY=$$SECRET_VITE_CLERK_PUBLISHABLE_KEY'
      - '--build-arg=VITE_NEON_AUTH_URL=$$SECRET_NEON_AUTH_BASE_URL'
      - '--build-arg=VITE_SENTRY_FRONTEND_DSN=$$SECRET_SENTRY_FRONTEND_DSN'
      - '--build-arg=VITE_DEBUG=false'
      - '.'
    secretEnv:
      - SECRET_VITE_CLERK_PUBLISHABLE_KEY
      - SECRET_NEON_AUTH_BASE_URL
      - SECRET_SENTRY_FRONTEND_DSN

  # ── Step 2: Push image to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/school-operations/api']

  # ── Step 3: Deploy to Cloud Run ─────────────────────────────────────────────
  # Non-sensitive env vars use --set-env-vars (single comma-separated flag).
  # Secrets use --update-secrets so Cloud Run resolves them from Secret Manager
  # at instance startup — the build process never sees the plaintext values.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy school-operations-api \
          --image=us-central1-docker.pkg.dev/$$PROJECT_ID/school-operations/api:$$BUILD_ID \
          --platform=managed \
          --region=us-central1 \
          --allow-unauthenticated \
          --port=$$PORT \
          --memory=1Gi \
          --cpu=2 \
          --max-instances=10 \
          --min-instances=0 \
          --timeout=600s \
          --cpu-boost \
          --service-account=school-operations-runtime@$$PROJECT_ID.iam.gserviceaccount.com \
          --set-env-vars=\
ENV=staging,\
DEFAULT_SCHOOL_TIMEZONE=Asia/Kolkata,\
QUEUE_PROVIDER=redis,\
SEARCH_INDEXING_LAG_TARGET_SECONDS=60,\
LOG_LEVEL=info,\
BEHIND_PROXY=true,\
CLOUD_SCHEDULER_IP_RANGES=$$CLOUD_SCHEDULER_IP_RANGES,\
MFA_REQUIRED_ROLES=Admin,\
SESSION_TIMEOUT_MINUTES=30,\
FEATURE_FLAG_MFA_ENABLED=true,\
FEATURE_FLAG_SSO_ENABLED=false,\
FEATURE_FLAG_OBSERVATION_REOPEN_ENABLED=false,\
FEATURE_FLAG_SAVED_FILTERS_ENABLED=false,\
FILE_UPLOAD_MAX_SIZE_MB=10,\
EVIDENCE_RETENTION_PERIOD_DAYS=90,\
IDEMPOTENCY_EXPIRY_HOURS=24,\
DUPLICATE_DETECTION_WINDOW_MINUTES=60,\
GRACE_PERIOD_HOURS=24,\
SCHEDULER_OUTAGE_GRACE_EXTENSION=2 \
          --update-secrets=\
DATABASE_URL=DATABASE_URL:latest,\
DATABASE_READ_REPLICA_URL=DATABASE_READ_REPLICA_URL:latest,\
NEON_PROJECT_ID=NEON_PROJECT_ID:latest,\
NEON_BRANCH_ID=NEON_BRANCH_ID:latest,\
NEON_API_KEY=NEON_API_KEY:latest,\
NEON_AUTH_BASE_URL=NEON_AUTH_BASE_URL:latest,\
NEON_AUTH_COOKIE_SECRET=NEON_AUTH_COOKIE_SECRET:latest,\
CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,\
CLERK_JWKS_URL=CLERK_JWKS_URL:latest,\
CLERK_WEBHOOK_SECRET=CLERK_WEBHOOK_SECRET:latest,\
PLATFORM_JWT_SECRET=PLATFORM_JWT_SECRET:latest,\
ENCRYPTION_KEY=ENCRYPTION_KEY:latest,\
INTERNAL_SCHEDULER_SECRET=INTERNAL_SCHEDULER_SECRET:latest,\
CORS_ORIGINS=CORS_ORIGINS:latest,\
REDIS_URL=REDIS_URL:latest,\
QUEUE_CONNECTION_STRING=REDIS_URL:latest,\
SEARCH_INDEX_URL=SEARCH_INDEX_URL:latest,\
SEARCH_INDEX_API_KEY=SEARCH_INDEX_API_KEY:latest,\
CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,\
CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,\
CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,\
CLOUDINARY_UPLOAD_PRESET=CLOUDINARY_UPLOAD_PRESET:latest,\
EMAIL_PROVIDER_API_KEY=EMAIL_PROVIDER_API_KEY:latest,\
EMAIL_FROM=EMAIL_FROM:latest,\
SMS_PROVIDER_API_KEY=SMS_PROVIDER_API_KEY:latest,\
WHATSAPP_PROVIDER_API_KEY=WHATSAPP_PROVIDER_API_KEY:latest,\
SENTRY_BACKEND_DSN=SENTRY_BACKEND_DSN:latest

# ── Secret Manager mappings ───────────────────────────────────────────────────
# Maps Secret Manager secret names → env vars available in build steps via $$.
availableSecrets:
  secretManager:
    # ── Frontend build args (used in Step 1 Docker build) ──
    - versionName: projects/$PROJECT_ID/secrets/VITE_CLERK_PUBLISHABLE_KEY/versions/latest
      env: SECRET_VITE_CLERK_PUBLISHABLE_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEON_AUTH_BASE_URL/versions/latest
      env: SECRET_NEON_AUTH_BASE_URL
    - versionName: projects/$PROJECT_ID/secrets/SENTRY_FRONTEND_DSN/versions/latest
      env: SECRET_SENTRY_FRONTEND_DSN

    # ── Runtime secrets (used in Step 3 --update-secrets) ──
    # These are NOT injected into the build process; they're referenced by name
    # in --update-secrets so Cloud Run resolves them at instance startup.
    # Listed here for documentation / if you ever need them in build steps.
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_READ_REPLICA_URL/versions/latest
      env: DATABASE_READ_REPLICA_URL
    - versionName: projects/$PROJECT_ID/secrets/NEON_PROJECT_ID/versions/latest
      env: NEON_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/NEON_BRANCH_ID/versions/latest
      env: NEON_BRANCH_ID
    - versionName: projects/$PROJECT_ID/secrets/NEON_API_KEY/versions/latest
      env: NEON_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/NEON_AUTH_BASE_URL/versions/latest
      env: NEON_AUTH_BASE_URL
    - versionName: projects/$PROJECT_ID/secrets/NEON_AUTH_COOKIE_SECRET/versions/latest
      env: NEON_AUTH_COOKIE_SECRET
    - versionName: projects/$PROJECT_ID/secrets/CLERK_SECRET_KEY/versions/latest
      env: CLERK_SECRET_KEY
    - versionName: projects/$PROJECT_ID/secrets/CLERK_JWKS_URL/versions/latest
      env: CLERK_JWKS_URL
    - versionName: projects/$PROJECT_ID/secrets/CLERK_WEBHOOK_SECRET/versions/latest
      env: CLERK_WEBHOOK_SECRET
    - versionName: projects/$PROJECT_ID/secrets/PLATFORM_JWT_SECRET/versions/latest
      env: PLATFORM_JWT_SECRET
    - versionName: projects/$PROJECT_ID/secrets/ENCRYPTION_KEY/versions/latest
      env: ENCRYPTION_KEY
    - versionName: projects/$PROJECT_ID/secrets/INTERNAL_SCHEDULER_SECRET/versions/latest
      env: INTERNAL_SCHEDULER_SECRET
    - versionName: projects/$PROJECT_ID/secrets/CORS_ORIGINS/versions/latest
      env: CORS_ORIGINS
    - versionName: projects/$PROJECT_ID/secrets/REDIS_URL/versions/latest
      env: REDIS_URL
    - versionName: projects/$PROJECT_ID/secrets/QUEUE_CONNECTION_STRING/versions/latest
      env: QUEUE_CONNECTION_STRING
    - versionName: projects/$PROJECT_ID/secrets/SEARCH_INDEX_URL/versions/latest
      env: SEARCH_INDEX_URL
    - versionName: projects/$PROJECT_ID/secrets/SEARCH_INDEX_API_KEY/versions/latest
      env: SEARCH_INDEX_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/CLOUDINARY_CLOUD_NAME/versions/latest
      env: CLOUDINARY_CLOUD_NAME
    - versionName: projects/$PROJECT_ID/secrets/CLOUDINARY_API_KEY/versions/latest
      env: CLOUDINARY_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/CLOUDINARY_API_SECRET/versions/latest
      env: CLOUDINARY_API_SECRET
    - versionName: projects/$PROJECT_ID/secrets/CLOUDINARY_UPLOAD_PRESET/versions/latest
      env: CLOUDINARY_UPLOAD_PRESET
    - versionName: projects/$PROJECT_ID/secrets/EMAIL_PROVIDER_API_KEY/versions/latest
      env: EMAIL_PROVIDER_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/EMAIL_FROM/versions/latest
      env: EMAIL_FROM
    - versionName: projects/$PROJECT_ID/secrets/SMS_PROVIDER_API_KEY/versions/latest
      env: SMS_PROVIDER_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/WHATSAPP_PROVIDER_API_KEY/versions/latest
      env: WHATSAPP_PROVIDER_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/SENTRY_BACKEND_DSN/versions/latest
      env: SENTRY_BACKEND_DSN
    - versionName: projects/$PROJECT_ID/secrets/SENTRY_FRONTEND_DSN/versions/latest
      env: SENTRY_FRONTEND_DSN
    - versionName: projects/$PROJECT_ID/secrets/CLOUD_SCHEDULER_IP_RANGES/versions/latest
      env: CLOUD_SCHEDULER_IP_RANGES

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
