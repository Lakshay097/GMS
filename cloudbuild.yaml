# Cloud Build configuration for deploying to Cloud Run
# Uses Google Secret Manager for all sensitive values.
#
# ─── REQUIRED GCP IAM PERMISSIONS ─────────────────────────────────────────────
#
# 1. Cloud Build service account (default: PROJECT_NUMBER@cloudbuild.gserviceaccount.com)
#    Grant these roles on the GCP project:
#      - roles/cloudbuild.builds.builder          (already granted by default)
#      - roles/secretmanager.secretAccessor       (read secrets during build)
#      - roles/run.admin                          (deploy to Cloud Run)
#      - roles/iam.serviceAccountUser             (act as Cloud Run runtime SA)
#      - roles/artifactregistry.writer            (push Docker images)
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#      --role="roles/secretmanager.secretAccessor"
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#      --role="roles/run.admin"
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#      --role="roles/iam.serviceAccountUser"
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#      --role="roles/artifactregistry.writer"
#
# 2. Cloud Run runtime service account (default: PROJECT_NUMBER-compute@developer.gserviceaccount.com)
#    Grant this role on the project so the running container can read secrets:
#      - roles/secretmanager.secretAccessor
#
#    gcloud projects add-iam-policy-binding PROJECT_ID \
#      --member="serviceAccount:PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
#      --role="roles/secretmanager.secretAccessor"
#
# 3. APIs to enable:
#      - cloudbuild.googleapis.com
#      - run.googleapis.com
#      - secretmanager.googleapis.com
#      - artifactregistry.googleapis.com
#
#    gcloud services enable cloudbuild.googleapis.com run.googleapis.com \
#      secretmanager.googleapis.com artifactregistry.googleapis.com
#
# ──────────────────────────────────────────────────────────────────────────────

steps:
  # ── Step 1: Build Docker image ──────────────────────────────────────────────
  # Vite build args are passed from Secret Manager via secretEnv.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/school-operations/api:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/school-operations/api:latest'
      - '--build-arg=VITE_CLERK_PUBLISHABLE_KEY=$$SECRET_VITE_CLERK_PUBLISHABLE_KEY'
      - '--build-arg=VITE_NEON_AUTH_URL=$$SECRET_VITE_NEON_AUTH_URL'
      - '--build-arg=VITE_SENTRY_FRONTEND_DSN=$$SENTRY_FRONTEND_DSN'
      - '--build-arg=VITE_DEBUG=false'
      - '.'
    secretEnv:
      - SECRET_VITE_CLERK_PUBLISHABLE_KEY
      - SECRET_VITE_NEON_AUTH_URL
      - SENTRY_FRONTEND_DSN

  # ── Step 2: Push image to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/school-operations/api']

  # ── Step 3: Deploy to Cloud Run ─────────────────────────────────────────────
  # Secrets use --update-secrets so Cloud Run resolves them from Secret Manager
  # at instance startup — the build process never sees the plaintext values.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy school-operations-api \
          --image=us-central1-docker.pkg.dev/$$PROJECT_ID/school-operations/api:$$BUILD_ID \
          --platform=managed \
          --region=us-central1 \
          --allow-unauthenticated \
          --port=8000 \
          --memory=1Gi \
          --cpu=2 \
          --max-instances=10 \
          --min-instances=0 \
          --timeout=600s \
          --cpu-boost \
          --service-account=school-operations-runtime@$$PROJECT_ID.iam.gserviceaccount.com \
          --set-env-vars='ENV=staging,DEFAULT_SCHOOL_TIMEZONE=Asia/Kolkata,QUEUE_PROVIDER=redis,SEARCH_INDEXING_LAG_TARGET_SECONDS=60,LOG_LEVEL=info,BEHIND_PROXY=true' \
          --update-secrets='DATABASE_URL=DATABASE_URL:latest,DATABASE_READ_REPLICA_URL=DATABASE_READ_REPLICA_URL:latest,NEON_PROJECT_ID=NEON_PROJECT_ID:latest,NEON_BRANCH_ID=NEON_BRANCH_ID:latest,NEON_API_KEY=NEON_API_KEY:latest,NEON_AUTH_BASE_URL=NEON_AUTH_BASE_URL:latest,NEON_AUTH_COOKIE_SECRET=NEON_AUTH_COOKIE_SECRET:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,CLERK_JWKS_URL=CLERK_JWKS_URL:latest,CLERK_WEBHOOK_SECRET=CLERK_WEBHOOK_SECRET:latest,PLATFORM_JWT_SECRET=PLATFORM_JWT_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,INTERNAL_SCHEDULER_SECRET=INTERNAL_SCHEDULER_SECRET:latest,CORS_ORIGINS=CORS_ORIGINS:latest,REDIS_URL=REDIS_URL:latest,QUEUE_CONNECTION_STRING=QUEUE_CONNECTION_STRING:latest,SEARCH_INDEX_URL=SEARCH_INDEX_URL:latest,SEARCH_INDEX_API_KEY=SEARCH_INDEX_API_KEY:latest,CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,CLOUDINARY_UPLOAD_PRESET=CLOUDINARY_UPLOAD_PRESET:latest,EMAIL_PROVIDER_API_KEY=EMAIL_PROVIDER_API_KEY:latest,EMAIL_FROM=EMAIL_FROM:latest,SMS_PROVIDER_API_KEY=SMS_PROVIDER_API_KEY:latest,WHATSAPP_PROVIDER_API_KEY=WHATSAPP_PROVIDER_API_KEY:latest,SENTRY_BACKEND_DSN=SENTRY_BACKEND_DSN:latest,CLOUD_SCHEDULER_IP_RANGES=CLOUD_SCHEDULER_IP_RANGES:latest'

# ── Secret Manager mappings ───────────────────────────────────────────────────
# Only secrets used via $$ substitution in build steps go here.
# Runtime secrets (DATABASE_URL, CLERK_*, REDIS_URL, etc.) are resolved by
# Cloud Run at instance startup via --update-secrets and do NOT belong here.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/VITE_CLERK_PUBLISHABLE_KEY/versions/latest
      env: SECRET_VITE_CLERK_PUBLISHABLE_KEY
    - versionName: projects/$PROJECT_ID/secrets/VITE_NEON_AUTH_URL/versions/latest
      env: SECRET_VITE_NEON_AUTH_URL
    - versionName: projects/$PROJECT_ID/secrets/SENTRY_FRONTEND_DSN/versions/latest
      env: SENTRY_FRONTEND_DSN

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
